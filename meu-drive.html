<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Drive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface2: #1e2330;
    --border: rgba(255,255,255,0.07);
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --text: #f0f4ff;
    --muted: #6b7280;
    --danger: #f87171;
    --radius: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
  }
  .orb1 { width: 500px; height: 500px; background: var(--accent2); top: -100px; left: -100px; }
  .orb2 { width: 400px; height: 400px; background: var(--accent); bottom: -80px; right: -80px; }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.6s ease both;
  }
  .login-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--text);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .login-logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
    font-weight: 300;
  }
  label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 8px; }
  input[type=password], input[type=text] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
  }
  input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: var(--radius);
    color: #0d0f14;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .login-error { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }

  /* ── APP ── */
  #app { display: none; min-height: 100vh; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar-logo span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .storage-badge {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
  }
  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  .main { padding: 32px; max-width: 1100px; margin: 0 auto; }

  /* ── STATS ── */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    animation: fadeUp 0.4s ease both;
  }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-family: 'DM Serif Display', serif; color: var(--text); }
  .stat-value.accent { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    margin-bottom: 28px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    background: var(--surface);
    animation: fadeUp 0.5s ease 0.1s both;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: rgba(110,231,183,0.04); }
  .upload-icon { font-size: 36px; margin-bottom: 12px; }
  .upload-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  .upload-sub { font-size: 13px; color: var(--muted); }
  #file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-progress {
    margin-top: 16px;
    background: var(--surface2);
    border-radius: 99px;
    height: 4px;
    overflow: hidden;
    display: none;
  }
  .upload-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.3s;
    width: 0%;
  }
  .upload-status { font-size: 13px; color: var(--accent); margin-top: 10px; min-height: 20px; }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
    animation: fadeUp 0.5s ease 0.2s both;
  }
  .toolbar-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    outline: none;
    width: 200px;
    transition: border-color 0.2s;
    margin-bottom: 0;
  }
  .search-input:focus { border-color: var(--accent2); }

  /* ── FILES GRID ── */
  .files-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    animation: fadeUp 0.5s ease 0.3s both;
  }
  .file-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .file-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
  .file-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .file-icon.pdf { background: rgba(248,113,113,0.12); }
  .file-icon.img { background: rgba(110,231,183,0.12); }
  .file-icon.video { background: rgba(129,140,248,0.12); }
  .file-icon.audio { background: rgba(251,191,36,0.12); }
  .file-icon.other { background: rgba(107,114,128,0.12); }
  .file-name { font-size: 13px; font-weight: 500; word-break: break-word; line-height: 1.4; }
  .file-meta { font-size: 11px; color: var(--muted); }
  .file-actions { display: flex; gap: 6px; margin-top: auto; }
  .btn-sm {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    padding: 6px 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .btn-sm:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .big { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }

  /* ── LOADING ── */
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 60px auto;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 20px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.success { border-color: var(--accent); color: var(--accent); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .main { padding: 16px; }
    .topbar { padding: 14px 16px; }
    .login-card { padding: 32px 24px; margin: 16px; }
    .upload-zone { padding: 28px 16px; }
  }
</style>
</head>
<body>

<!-- BG ORBS -->
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">☁ <span>Meu Drive</span></div>
    <p class="login-sub">Seu armazenamento pessoal na nuvem</p>
    <label for="pwd">Senha de administrador</label>
    <input type="password" id="pwd" placeholder="Digite sua senha..." onkeydown="if(event.key==='Enter')login()">
    <button class="btn-primary" onclick="login()">Entrar</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">☁ <span>Meu Drive</span></div>
    <div class="topbar-right">
      <span class="storage-badge" id="storage-info">Calculando...</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-label">Total de arquivos</div><div class="stat-value accent" id="stat-total">0</div></div>
      <div class="stat-card"><div class="stat-label">Fotos</div><div class="stat-value" id="stat-img">0</div></div>
      <div class="stat-card"><div class="stat-label">PDFs</div><div class="stat-value" id="stat-pdf">0</div></div>
      <div class="stat-card"><div class="stat-label">Outros</div><div class="stat-value" id="stat-other">0</div></div>
    </div>

    <!-- Upload -->
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" multiple onchange="handleFiles(this.files)">
      <div class="upload-icon">⬆</div>
      <div class="upload-title">Soltar arquivos aqui ou clicar para escolher</div>
      <div class="upload-sub">PDF, fotos, vídeos, documentos — qualquer formato</div>
      <div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="progress-bar"></div></div>
      <div class="upload-status" id="upload-status"></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="filter-btn active" onclick="setFilter('todos', this)">Todos</button>
        <button class="filter-btn" onclick="setFilter('imagem', this)">Fotos</button>
        <button class="filter-btn" onclick="setFilter('pdf', this)">PDFs</button>
        <button class="filter-btn" onclick="setFilter('video', this)">Vídeos</button>
        <button class="filter-btn" onclick="setFilter('audio', this)">Áudio</button>
      </div>
      <input class="search-input" type="text" placeholder="Buscar arquivo..." oninput="searchFiles(this.value)">
    </div>

    <!-- Files -->
    <div id="files-container">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://focctokqudlpmkeqxarc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY2N0b2txdWRscG1rZXF4YXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjQzNTUsImV4cCI6MjA5MzUwMDM1NX0.R4cMsuvcVUhRsKTDZzdfRc5GXKBEVTF6TO-jKoiTz2k';
const ADMIN_PASSWORD = 'meudrive2024'; // ← TROQUE POR SUA SENHA!
const BUCKET = 'arquivos';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let allFiles = [];
let currentFilter = 'todos';
let currentSearch = '';

// ── LOGIN ──
function login() {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('login-error');
  if (pwd === ADMIN_PASSWORD) {
    sessionStorage.setItem('auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadFiles();
  } else {
    err.textContent = 'Senha incorreta. Tente novamente.';
    document.getElementById('pwd').style.borderColor = '#f87171';
  }
}

function logout() {
  sessionStorage.removeItem('auth');
  location.reload();
}

// Auto-login se já autenticado
if (sessionStorage.getItem('auth')) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadFiles();
}

// ── UPLOAD ──
const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); handleFiles(e.dataTransfer.files); });

async function handleFiles(files) {
  if (!files.length) return;
  const progressEl = document.getElementById('upload-progress');
  const barEl = document.getElementById('progress-bar');
  const statusEl = document.getElementById('upload-status');
  progressEl.style.display = 'block';
  let done = 0;
  for (const file of files) {
    statusEl.textContent = `Enviando ${file.name}...`;
    const path = `${Date.now()}_${file.name}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, file);
    if (error) { showToast('Erro ao enviar: ' + file.name, 'error'); }
    else { done++; showToast(`${file.name} salvo!`, 'success'); }
    barEl.style.width = ((done / files.length) * 100) + '%';
  }
  statusEl.textContent = `${done} de ${files.length} arquivo(s) enviado(s)!`;
  setTimeout(() => { progressEl.style.display = 'none'; barEl.style.width = '0%'; statusEl.textContent = ''; }, 3000);
  loadFiles();
}

// ── LOAD FILES ──
async function loadFiles() {
  const { data, error } = await sb.storage.from(BUCKET).list('', { limit: 500, sortBy: { column: 'created_at', order: 'desc' } });
  if (error) { showToast('Erro ao carregar arquivos', 'error'); return; }
  allFiles = data || [];
  updateStats();
  renderFiles();
}

function updateStats() {
  const imgs = allFiles.filter(f => isType(f.name, 'imagem')).length;
  const pdfs = allFiles.filter(f => isType(f.name, 'pdf')).length;
  document.getElementById('stat-total').textContent = allFiles.length;
  document.getElementById('stat-img').textContent = imgs;
  document.getElementById('stat-pdf').textContent = pdfs;
  document.getElementById('stat-other').textContent = allFiles.length - imgs - pdfs;
  const sizeMB = allFiles.reduce((s, f) => s + (f.metadata?.size || 0), 0) / 1024 / 1024;
  document.getElementById('storage-info').textContent = sizeMB.toFixed(1) + ' MB usado';
}

// ── RENDER ──
function renderFiles() {
  const container = document.getElementById('files-container');
  let files = allFiles.filter(f => {
    const matchFilter = currentFilter === 'todos' || isType(f.name, currentFilter);
    const matchSearch = f.name.toLowerCase().includes(currentSearch.toLowerCase());
    return matchFilter && matchSearch;
  });

  if (!files.length) {
    container.innerHTML = `<div class="empty-state"><div class="big">☁</div><p>Nenhum arquivo encontrado.<br>Faça upload para começar!</p></div>`;
    return;
  }

  container.innerHTML = `<div class="files-grid">${files.map(f => fileCard(f)).join('')}</div>`;
}

function fileCard(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  const type = getType(f.name);
  const icons = { pdf:'📄', imagem:'🖼', video:'🎬', audio:'🎵', other:'📁' };
  const size = f.metadata?.size ? (f.metadata.size / 1024).toFixed(1) + ' KB' : '';
  const name = f.name.replace(/^\d+_/, '');
  return `<div class="file-card">
    <div class="file-icon ${type}">${icons[type] || icons.other}</div>
    <div class="file-name" title="${name}">${name.length > 28 ? name.slice(0,26)+'…' : name}</div>
    <div class="file-meta">${ext.toUpperCase()} ${size ? '· ' + size : ''}</div>
    <div class="file-actions">
      <button class="btn-sm" onclick="downloadFile('${f.name}','${name}')">⬇ Baixar</button>
      <button class="btn-sm danger" onclick="deleteFile('${f.name}')">🗑</button>
    </div>
  </div>`;
}

// ── DOWNLOAD ──
async function downloadFile(path, name) {
  const { data, error } = await sb.storage.from(BUCKET).download(path);
  if (error) { showToast('Erro ao baixar', 'error'); return; }
  const url = URL.createObjectURL(data);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
  showToast('Download iniciado!', 'success');
}

// ── DELETE ──
async function deleteFile(path) {
  if (!confirm('Deletar este arquivo?')) return;
  const { error } = await sb.storage.from(BUCKET).remove([path]);
  if (error) { showToast('Erro ao deletar', 'error'); return; }
  showToast('Arquivo deletado', 'success');
  loadFiles();
}

// ── FILTER / SEARCH ──
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFiles();
}
function searchFiles(q) { currentSearch = q; renderFiles(); }

// ── HELPERS ──
function getType(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','webp','svg','bmp','heic'].includes(ext)) return 'imagem';
  if (ext === 'pdf') return 'pdf';
  if (['mp4','mov','avi','mkv','webm'].includes(ext)) return 'video';
  if (['mp3','wav','ogg','m4a','flac'].includes(ext)) return 'audio';
  return 'other';
}
function isType(name, type) { return getType(name) === type; }

// ── TOAST ──
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}
</script>
</body>
</html>
